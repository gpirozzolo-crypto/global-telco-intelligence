name: Update telco intelligence data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/ingest/**'
      - 'src/run_pipeline.py'
      - '.github/workflows/update-data.yml'
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Supabase connectivity check
        env: &supabase_env
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/run_pipeline.py --source healthcheck
      - name: Probe regulatory sources
        env: *supabase_env
        run: python src/run_pipeline.py --source probes
      - name: Discover ARCEP resources
        env: *supabase_env
        run: python src/run_pipeline.py --source arcep
      - name: Load ARCEP raw and normalized observations
        env: *supabase_env
        run: python src/run_pipeline.py --source arcep-load
      - name: Load ARCEP FTTH deployment observations
        continue-on-error: true
        env: *supabase_env
        run: python src/run_pipeline.py --source arcep-deployment-load
      - name: Inspect AGCOM workbook
        env: *supabase_env
        run: python src/run_pipeline.py --source agcom-inspect
      - name: Load AGCOM raw and normalized observations
        env: *supabase_env
        run: python src/run_pipeline.py --source agcom-load
      - name: Inspect CNMC datasets
        env: *supabase_env
        run: python src/run_pipeline.py --source cnmc-inspect
      - name: Load CNMC raw and normalized observations
        env: *supabase_env
        run: python src/run_pipeline.py --source cnmc-load
      - name: Inspect BNetzA workbook
        env: *supabase_env
        run: python src/run_pipeline.py --source bnetza-inspect
      - name: Load BNetzA raw and normalized observations
        env: *supabase_env
        run: python src/run_pipeline.py --source bnetza-load
      - name: Load Ofcom source-driven observations
        continue-on-error: true
        env: *supabase_env
        run: python src/run_pipeline.py --source ofcom-load
      - name: Load Ofcom Connected Nations fibre observations
        continue-on-error: true
        env: *supabase_env
        run: python src/run_pipeline.py --source ofcom-fibre-load
      - name: Refresh calculated KPIs
        env: *supabase_env
        run: python src/run_pipeline.py --source calculated
      - name: Run data quality checks
        env: *supabase_env
        run: python src/run_pipeline.py --source quality
