name: Update telco intelligence data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Supabase connectivity check
        env: &supabase_env
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/run_pipeline.py --source healthcheck
      - name: Probe regulatory sources
        env: *supabase_env
        run: python src/run_pipeline.py --source probes
      - name: Discover ARCEP resources
        env: *supabase_env
        run: python src/run_pipeline.py --source arcep
      - name: Inspect ARCEP workbooks
        env: *supabase_env
        run: python src/run_pipeline.py --source arcep-inspect
